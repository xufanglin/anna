[workspace]
resolver = "3"
members = [
    "crates/anna-ir",
    "crates/anna-adapters",
    "crates/anna-core",
    "crates/anna-cli",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/anna-cli/anna"
rust-version = "1.85"

[workspace.dependencies]
# 内部 crate
anna-ir = { path = "crates/anna-ir" }
anna-adapters = { path = "crates/anna-adapters" }
anna-core = { path = "crates/anna-core" }

# 外部依赖
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
dialoguer = { version = "0.11", default-features = false }
walkdir = "2.5"
glob = "0.3"
dirs = "5"
gray_matter = { version = "0.3", default-features = false, features = ["yaml"] }
toml = "0.8"
toml_edit = "0.22"
